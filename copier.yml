_min_copier_version: "9.0.0"
_answers_file: .copier-answers.yml
_exclude:
  - .git
  - .venv
  - copier.yml
  # Template-side documentation, for the person creating a new distro.
  # Generated distros get their own README.md.jinja-rendered README.
  - CREATING-A-DISTRO.md
  # Note on README.md: NOT excluded. The template repo carries both a
  # plain README.md (for GitHub display on this repo) and README.md.jinja
  # (the generated distro's README). Both render to the destination path
  # `README.md`. Copier resolves this collision deterministically — the
  # .jinja-suffixed file wins — so generated distros get the rendered
  # README, never the template's own. Adding README.md to _exclude here
  # would skip the .jinja-rendered output too (excludes match destination
  # paths, not source).
  # In-place bootstrap script. Lives in the template source so a fresh
  # "Use this template" clone has it; init.sh self-deletes after running.
  - scripts/init.sh
  # Template repo's own CI (exercises the init.sh flow on every PR) —
  # generated distros get release.yml only.
  - .github/workflows/pr.yml
  # Build-time-only post-generate tasks, run from the template source.
  - tools/copier_tasks

# .env.example carries generated secrets after `copier copy`; never overwrite
# on `copier update` (would silently rotate the operator's stored values).
_skip_if_exists:
  - .env.example

_tasks:
  - ["python3", "{{ _copier_conf.src_path }}/tools/copier_tasks/generate_secrets.py"]
  - ["python3", "{{ _copier_conf.src_path }}/tools/copier_tasks/merge_profiles.py"]

context_slug:
  type: str
  default: demo
  help: Lowercase context slug used in repo names and generated paths.

context_name:
  type: str
  default: Demo Country
  help: Human-readable country or implementation context name.

project_name:
  type: str
  default: OpenELIS Demo Distro
  help: Display name used in README and banner defaults.

timezone:
  type: str
  default: UTC
  help: IANA timezone for Docker services.

default_nationality:
  type: str
  default: Demo
  help: DEFAULT_NATIONALITY value for SystemConfiguration.properties.

facility_id:
  type: str
  default: demo-facility
  help: Default OpenELIS facility identifier.

public_hostname:
  type: str
  default: demo.openelis.example.org
  help: Example production hostname for TLS documentation and .env defaults.

tarball_basename:
  type: str
  default: openelis-{{ context_slug }}-distro
  help: Basename for release tarballs (e.g. <basename>-3.2.2.0.tar.gz).
